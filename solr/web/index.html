<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c111b">
  <title>GRIDLY</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css?v=4">
  <script src="/app.js?v=5" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Gridly home"><span class="brand-mark">F1</span> GRIDLY</a>
    <span class="collection-status"><span class="status-dot"></span>2,058 DOCUMENTS · 1950–2026</span>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">GRIDLY</p>
      <h1>Searching the history<br><span>of Formula 1.</span></h1>
      <p class="intro">Search races, drivers, teams and circuits across F1 history.</p>

      <form id="search-form" class="search-panel">
        <label class="sr-only" for="query">Search the archive</label>
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="query" name="q" type="search" placeholder="What would you like to know about F1?"
               autocomplete="off" required>
        <button type="submit">Search <span aria-hidden="true">→</span></button>
      </form>

      <div class="filters">
        <label>TYPE
          <select id="type">
            <option value="all">Everything</option>
            <option value="race">Races</option>
            <option value="driver">Drivers</option>
            <option value="team">Teams</option>
            <option value="circuit">Circuits</option>
          </select>
        </label>
        <label>SEASONS
          <input id="from" class="year" type="number" min="1950" max="2026" placeholder="1950" inputmode="numeric">
          <span class="dash">–</span>
          <input id="to" class="year" type="number" min="1950" max="2026" placeholder="2026" inputmode="numeric">
        </label>
        <label>RANKING
          <select id="system">
            <option value="boosted">Boosted</option>
            <option value="simple">Baseline</option>
            <option value="schemaless">Schemaless</option>
          </select>
        </label>
        <label class="toggle">
          <input id="compare" type="checkbox"> COMPARE ALL
        </label>
      </div>

      <div id="examples" class="quick-searches" hidden>
        <span>TRY AN INFORMATION NEED</span>
      </div>
    </section>

    <section class="results-section" aria-live="polite">
      <p id="correction" class="correction" hidden></p>
      <div id="type-counts" class="type-counts" hidden></div>
      <div id="results-heading" class="results-heading"></div>
      <p id="message" class="message">Search the archive to explore more than 2,000 F1 documents.</p>
      <div id="results" class="results"></div>
      <nav id="pagination" class="pagination" aria-label="Search result pages" hidden>
        <button id="previous" type="button">← Previous</button>
        <span id="page-label"></span>
        <button id="next" type="button">Next →</button>
      </nav>
    </section>
  </main>
  <footer><span>FORMULA ONE · 1950—2026</span><span>POWERED BY SOLR</span></footer>
</body>
</html>
